<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin | Rey de Reyes</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

:root{
  --negro:#080808;
  --negro2:#11110f;
  --card:#161614;
  --dorado:#d7b56d;
  --dorado-claro:#f0d99d;
  --blanco:#f8f6f1;
  --gris:#aaa79e;
  --linea:#2b2924;
  --verde:#8fc79b;
  --rojo:#d98989;
  --amarillo:#e5c875;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  background:
    radial-gradient(
      circle at 50% -10%,
      #3b301d 0%,
      transparent 35%
    ),
    var(--negro);

  color:var(--blanco);
  font-family:'DM Sans',sans-serif;
  min-height:100vh;
}

.container{
  width:min(100%,700px);
  margin:auto;
  padding:25px 17px 50px;
}


/* ==========================================
   LOGIN
   ========================================== */

.login{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.login-card{
  width:100%;
  max-width:430px;

  background:
    linear-gradient(
      145deg,
      #191917,
      #11110f
    );

  border:1px solid var(--linea);
  border-radius:24px;
  padding:32px 22px;

  box-shadow:
    0 20px 60px #00000070;

  text-align:center;
}

.logo{
  width:85px;
  height:85px;

  margin:0 auto 18px;

  border:1px solid var(--dorado);
  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:var(--dorado-claro);

  font-weight:700;
  font-size:11px;

  letter-spacing:2px;
  line-height:1.4;

  box-shadow:
    0 0 35px #d7b56d18;
}

.login h1{
  font-family:'Playfair Display',serif;
  letter-spacing:2px;
  margin-bottom:6px;
}

.login p{
  color:var(--gris);
  font-size:12px;
  margin-bottom:22px;
}

.input{
  width:100%;

  padding:14px;

  border-radius:12px;

  border:1px solid #3a352c;

  background:#11110f;

  color:white;

  outline:none;

  font-family:inherit;
  font-size:14px;
}

.input:focus{
  border-color:var(--dorado);
}

.error{
  color:var(--rojo);
  font-size:12px;
  margin-top:12px;
  display:none;
}


/* ==========================================
   GENERAL
   ========================================== */

.hidden{
  display:none !important;
}

header{
  text-align:center;
  padding:15px 0 25px;
}

header h1{
  font-family:'Playfair Display',serif;
  font-size:30px;
  letter-spacing:3px;
}

header p{
  color:var(--gris);
  font-size:11px;
  letter-spacing:2px;
  margin-top:6px;
}

.card{
  background:
    linear-gradient(
      145deg,
      #191917,
      #11110f
    );

  border:1px solid var(--linea);

  border-radius:20px;

  padding:20px;

  margin-bottom:15px;

  box-shadow:
    0 15px 40px #00000040;
}


/* ==========================================
   CABECERA DEL ADMIN
   ========================================== */

.admin-header{
  position:relative;
}

.logout-btn{
  position:absolute;
  right:0;
  top:0;

  border:1px solid #4b3939;
  background:#1b1414;
  color:var(--rojo);

  border-radius:10px;

  padding:8px 10px;

  font-family:inherit;
  font-size:10px;
  font-weight:700;

  cursor:pointer;
}


/* ==========================================
   ESTADÍSTICAS
   ========================================== */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.stat{
  background:#11110f;

  border:1px solid var(--linea);

  border-radius:15px;

  padding:15px 8px;

  text-align:center;
}

.stat strong{
  display:block;

  font-size:22px;

  color:var(--dorado-claro);
}

.stat span{
  display:block;

  color:var(--gris);

  font-size:10px;

  margin-top:4px;
}


/* ==========================================
   CONTROLES
   ========================================== */

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.date-filter{
  flex:1;
  min-width:180px;
}

.btn{
  border:0;

  border-radius:12px;

  padding:13px 16px;

  background:
    linear-gradient(
      100deg,
      #b48d47,
      #efd38c
    );

  color:#111;

  font-weight:700;

  font-family:inherit;

  cursor:pointer;

  transition:.2s;
}

.btn:hover{
  transform:translateY(-1px);
}

.btn-dark{
  background:#211c13;

  color:var(--dorado-claro);

  border:1px solid #675737;
}


/* ==========================================
   RESERVAS
   ========================================== */

.reservation{
  border:1px solid var(--linea);

  border-radius:17px;

  padding:17px;

  margin-top:11px;

  background:#121210;

  transition:.2s;
}

.reservation:hover{
  border-color:#4b412e;
}

.reservation-top{
  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:flex-start;
}

.reservation-time{
  font-size:22px;

  font-weight:700;

  color:var(--dorado-claro);
}

.reservation-date{
  color:var(--gris);

  font-size:11px;

  margin-top:3px;
}

.status{
  padding:6px 9px;

  border-radius:20px;

  font-size:10px;

  font-weight:700;

  white-space:nowrap;
}

.status-pendiente{
  background:#332d19;
  color:var(--amarillo);
}

.status-confirmada{
  background:#17251a;
  color:var(--verde);
}

.status-cancelada{
  background:#2c1818;
  color:var(--rojo);
}

.reservation-info{
  margin-top:14px;

  border-top:1px solid var(--linea);

  padding-top:12px;
}

.info-line{
  font-size:12px;

  margin-top:7px;

  color:#ddd8ce;

  line-height:1.4;
}

.info-line span{
  color:var(--gris);
}


/* ==========================================
   BOTONES DE RESERVA
   ========================================== */

.actions{
  display:flex;

  gap:8px;

  margin-top:15px;

  flex-wrap:wrap;
}

.action-btn{
  flex:1;

  min-width:120px;

  border-radius:10px;

  padding:11px 5px;

  border:1px solid var(--linea);

  background:#181714;

  color:white;

  cursor:pointer;

  font-family:inherit;

  font-size:11px;

  font-weight:600;

  transition:.2s;
}

.action-btn:hover{
  transform:translateY(-1px);
}

.confirm-btn{
  border-color:#38563d;
  color:var(--verde);
}

.confirm-btn:hover{
  background:#17251a;
}

.cancel-btn{
  border-color:#5b3636;
  color:var(--rojo);
}

.cancel-btn:hover{
  background:#2c1818;
}

.whatsapp-btn{
  border-color:#38563d;
  color:#9ac79d;
}

.whatsapp-btn:hover{
  background:#17251a;
}


/* ==========================================
   FIDELIDAD
   ========================================== */

.loyalty{
  margin-top:15px;

  padding:15px;

  border:1px solid #4b412e;

  border-radius:15px;

  background:#171613;
}

.loyalty-title{
  display:flex;

  justify-content:space-between;

  align-items:center;
}

.loyalty-title strong{
  color:var(--dorado-claro);
}

.stamps{
  display:flex;

  gap:7px;

  margin:12px 0;
}

.stamp{
  height:35px;

  flex:1;

  border-radius:10px;

  border:1px solid #4b412e;

  display:flex;

  align-items:center;

  justify-content:center;

  color:#686257;

  font-size:15px;
}

.stamp.active{
  background:
    linear-gradient(
      145deg,
      #e1c47d,
      #a9813c
    );

  color:#111;

  border-color:#e5c985;
}

.loyalty-message{
  color:var(--gris);

  font-size:11px;

  line-height:1.5;
}

.loyalty-btn{
  width:100%;

  margin-top:10px;

  padding:10px;

  border-radius:10px;

  border:1px solid #675737;

  background:#211c13;

  color:var(--dorado-claro);

  font-weight:700;

  cursor:pointer;

  font-family:inherit;

  font-size:11px;

  transition:.2s;
}

.loyalty-btn:hover{
  transform:translateY(-1px);
}

.free{
  border-color:#66552b;

  background:#29220f;

  color:var(--dorado-claro);
}

.free-message{
  color:var(--dorado-claro);

  font-weight:700;

  font-size:12px;

  margin-top:8px;
}


/* ==========================================
   MENSAJES
   ========================================== */

.empty{
  text-align:center;

  padding:35px 10px;

  color:var(--gris);

  font-size:13px;

  line-height:1.6;
}

.loading{
  text-align:center;

  color:var(--gris);

  padding:25px;
}


/* ==========================================
   FOOTER
   ========================================== */

footer{
  text-align:center;

  color:#696761;

  font-size:10px;

  letter-spacing:1px;

  padding:20px 0;
}


/* ==========================================
   CELULAR
   ========================================== */

@media(max-width:500px){

  .container{
    padding:20px 13px 40px;
  }

  .stats{
    grid-template-columns:repeat(3,1fr);
  }

  .stat{
    padding:13px 5px;
  }

  .stat strong{
    font-size:19px;
  }

  .stat span{
    font-size:9px;
  }

  .controls{
    flex-direction:column;
  }

  .date-filter{
    width:100%;
    min-width:0;
  }

  .controls .btn{
    width:100%;
  }

  .reservation-top{
    align-items:flex-start;
  }

  .reservation-time{
    font-size:20px;
  }

  .actions{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  .whatsapp-btn{
    grid-column:1 / -1;
  }

  .action-btn{
    min-width:0;
  }

  .logout-btn{
    position:static;

    margin-top:12px;

    width:100%;
  }

}


/* ==========================================
   EXTRA CELULAR PEQUEÑO
   ========================================== */

@media(max-width:360px){

  .stats{
    gap:6px;
  }

  .stat strong{
    font-size:17px;
  }

  .stat span{
    font-size:8px;
  }

  .stamp{
    font-size:13px;
  }

}

</style>

</head>


<body>


<!-- ========================================
     LOGIN
     ======================================== -->

<div
  id="loginScreen"
  class="login">

  <div class="login-card">

    <div class="logo">

      REY<br>
      DE<br>
      REYES

    </div>


    <h1>
      Panel de Administración
    </h1>


    <p>
      Gestiona las reservas de Rey de Reyes
    </p>


    <input
      id="passwordInput"
      class="input"

      placeholder="Contraseña"

    <button

</div>


<!-- ========================================
     PANEL
     ======================================== -->

<div
  id="adminPanel"
  class="container hidden">


  <header class="admin-header">

    <h1>
      REY DE REYES
    </h1>


    <p>
      PANEL DE ADMINISTRACIÓN
    </p>


    <button
      id="logoutButton"
      class="logout-btn">

      🚪 CERRAR SESIÓN

    </button>

  </header>


  <!-- ======================================
       ESTADÍSTICAS
       ====================================== -->

  <section class="card">

    <div class="stats">


      <div class="stat">

        <strong id="totalReservations">
          0
        </strong>

        <span>
          RESERVAS
        </span>

      </div>


      <div class="stat">

        <strong id="pendingReservations">
          0
        </strong>

        <span>
          PENDIENTES
        </span>

      </div>


      <div class="stat">

        <strong id="confirmedReservations">
          0
        </strong>

        <span>
          CONFIRMADAS
        </span>

      </div>


    </div>

  </section>


  <!-- ======================================
       FILTROS
       ====================================== -->

  <section class="card">

    <div style="margin-bottom:12px;">

      <strong>
        📅 Buscar reservas
      </strong>

    </div>


    <div class="controls">


      <input
        type="date"
        id="dateFilter"
        class="input date-filter">


      <button
        id="todayButton"
        class="btn">

        HOY

      </button>


      <button
        id="allButton"
        class="btn btn-dark">

        TODAS

      </button>


      <button
        id="refreshButton"
        class="btn btn-dark">

        🔄 ACTUALIZAR

      </button>


    </div>

  </section>


  <!-- ======================================
       RESERVAS
       ====================================== -->

  <section class="card">

    <h2 style="font-size:17px;">

      📋 Reservas

    </h2>


    <p
      id="reservationSubtitle"
      style="
        color:var(--gris);
        font-size:11px;
        margin:5px 0 10px;
      ">

      Cargando reservas...

    </p>


    <div id="reservationsList">

      <div class="loading">

        Cargando reservas...

      </div>

    </div>

  </section>


  <footer>

    REY DE REYES · ADMINISTRACIÓN

  </footer>


</div>


<script>

/* ==========================================
   SUPABASE
   ========================================== */

const SUPABASE_URL =
  'https://yuoowwhuirefwfzugevv.supabase.co';


const SUPABASE_KEY =
  'sb_publishable_vRnRgcBrlkmUk9RkH7EWbg_tDkBv_6t';


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* ==========================================
   CONTRASEÑA ACTUAL
   ========================================== */

const ADMIN_PASSWORD =
  'ReyDeReyes2026';


/* ==========================================
   ELEMENTOS
   ========================================== */

const loginScreen =
  document.getElementById(
    'loginScreen'
  );


const adminPanel =
  document.getElementById(
    'adminPanel'
  );


const passwordInput =
  document.getElementById(
    'passwordInput'
  );


const loginButton =
  document.getElementById(
    'loginButton'
  );


const loginError =
  document.getElementById(
    'loginError'
  );


const reservationsList =
  document.getElementById(
    'reservationsList'
  );


const dateFilter =
  document.getElementById(
    'dateFilter'
  );


const totalReservations =
  document.getElementById(
    'totalReservations'
  );


const pendingReservations =
  document.getElementById(
    'pendingReservations'
  );


const confirmedReservations =
  document.getElementById(
    'confirmedReservations'
  );


const reservationSubtitle =
  document.getElementById(
    'reservationSubtitle'
  );


/* ==========================================
   LOGIN
   ========================================== */

function login(){

  const password =
    passwordInput.value.trim();


  if(
    password ===
    ADMIN_PASSWORD
  ){

    loginError.style.display =
      'none';


    loginScreen.classList.add(
      'hidden'
    );


    adminPanel.classList.remove(
      'hidden'
    );


    loadReservations();


  }else{

    loginError.style.display =
      'block';


    passwordInput.value =
      '';


    passwordInput.focus();

  }

}


loginButton.addEventListener(
  'click',
  login
);


passwordInput.addEventListener(
  'keydown',
  event => {

    if(
      event.key ===
      'Enter'
    ){

      login();

    }

  }
);


/* ==========================================
   CERRAR SESIÓN
   ========================================== */

document
  .getElementById(
    'logoutButton'
  )
  .addEventListener(
    'click',
    () => {

      adminPanel.classList.add(
        'hidden'
      );


      loginScreen.classList.remove(
        'hidden'
      );


      passwordInput.value =
        '';


      passwordInput.focus();

    }
  );


/* ==========================================
   FECHA DE HOY
   ========================================== */

function getToday(){

  const today =
    new Date();


  const year =
    today.getFullYear();


  const month =
    String(
      today.getMonth() + 1
    ).padStart(
      2,
      '0'
    );


  const day =
    String(
      today.getDate()
    ).padStart(
      2,
      '0'
    );


  return `${year}-${month}-${day}`;

}


/* ==========================================
   CARGAR RESERVAS
   ========================================== */

async function loadReservations(){

  reservationsList.innerHTML =
    '<div class="loading">⏳ Cargando reservas...</div>';


  try{

    let query =
      supabaseClient
        .from('reservas')
        .select('*')
        .order(
          'fecha',
          {
            ascending:true
          }
        )
        .order(
          'hora',
          {
            ascending:true
          }
        );


    const selectedDate =
      dateFilter.value;


    if(selectedDate){

      query =
        query.eq(
          'fecha',
          selectedDate
        );

    }


    const {
      data,
      error
    } = await query;


    if(error){

      reservationsList.innerHTML =
        `<div class="empty">

          ❌ No se pudieron cargar las reservas.

          <br><br>

          ${escapeHTML(error.message)}

        </div>`;

      return;

    }


    if(
      !data ||
      data.length === 0
    ){

      reservationsList.innerHTML =
        `<div class="empty">

          📅 No hay reservas
          ${
            selectedDate
              ? 'para esta fecha'
              : ''
          }

        </div>`;


      updateStats([]);


      reservationSubtitle.innerText =
        selectedDate
          ? `Reservas del ${formatDate(selectedDate)}`
          : 'Todas las reservas';


      return;

    }


    /* ======================================
       CLIENTES
       ====================================== */

    const clientIds =
      [
        ...new Set(
          data
            .map(
              reservation =>
                reservation.cliente_id
            )
            .filter(Boolean)
        )
      ];


    let clients = [];


    if(
      clientIds.length > 0
    ){

      const {
        data:clientData,
        error:clientError
      } =
        await supabaseClient
          .from('clientes')
          .select(
            'id,nombre,whatsapp,cortes_completados,beneficio_disponible'
          )
          .in(
            'id',
            clientIds
          );


      if(clientError){

        console.error(
          clientError
        );

      }


      clients =
        clientData || [];

    }


    /* ======================================
       SERVICIOS
       ====================================== */

    const serviceIds =
      [
        ...new Set(
          data
            .map(
              reservation =>
                reservation.servicio_id
            )
            .filter(Boolean)
        )
      ];


    let services = [];


    if(
      serviceIds.length > 0
    ){

      const {
        data:serviceData,
        error:serviceError
      } =
        await supabaseClient
          .from('servicios')
          .select(
            'id,nombre,precio'
          )
          .in(
            'id',
            serviceIds
          );


      if(serviceError){

        console.error(
          serviceError
        );

      }


      services =
        serviceData || [];

    }


    /* ======================================
       UNIR INFORMACIÓN
       ====================================== */

    const completeReservations =
      data.map(
        reservation => {

          const client =
            clients.find(
              item =>
                item.id ===
                reservation.cliente_id
            );


          const service =
            services.find(
              item =>
                item.id ===
                reservation.servicio_id
            );


          return {

            ...reservation,

            client:
              client || null,

            service:
              service || null

          };

        }
      );


    updateStats(
      completeReservations
    );


    renderReservations(
      completeReservations
    );


    reservationSubtitle.innerText =
      selectedDate
        ? `Reservas del ${formatDate(selectedDate)}`
        : `Todas las reservas · ${data.length}`;

  }catch(error){

    console.error(
      error
    );


    reservationsList.innerHTML =
      `<div class="empty">

        ❌ Ocurrió un error.

        <br><br>

        ${escapeHTML(error.message)}

      </div>`;

  }

}


/* ==========================================
   ESTADÍSTICAS
   ========================================== */

function updateStats(
  reservations
){

  totalReservations.innerText =
    reservations.length;


  pendingReservations.innerText =
    reservations.filter(
      reservation =>
        reservation.estado ===
        'pendiente'
    ).length;


  confirmedReservations.innerText =
    reservations.filter(
      reservation =>
        reservation.estado ===
        'confirmada'
    ).length;

}


/* ==========================================
   MOSTRAR RESERVAS
   ========================================== */

function renderReservations(
  reservations
){

  reservationsList.innerHTML =
    '';


  reservations.forEach(
    reservation => {

      const card =
        document.createElement(
          'div'
        );


      card.className =
        'reservation';


      const estado =
        reservation.estado ||
        'pendiente';


      let statusClass =
        'status-pendiente';


      let statusText =
        '🟡 PENDIENTE';


      if(
        estado ===
        'confirmada'
      ){

        statusClass =
          'status-confirmada';


        statusText =
          '🟢 CONFIRMADA';

      }


      if(
        estado ===
        'cancelada'
      ){

        statusClass =
          'status-cancelada';


        statusText =
          '🔴 CANCELADA';

      }


      const client =
        reservation.client ||
        {};


      const clientName =
        client.nombre ||
        'Cliente';


      const phone =
        client.whatsapp ||
        'No registrado';


      const service =
        reservation.service ||
        {};


      const serviceName =
        service.nombre ||
        'Servicio';


      const price =
        service.precio;


      const formattedPrice =
        price
          ? '$' +
            Number(price)
              .toLocaleString(
                'es-CL'
              )
          : '';


      const whatsappNumber =
        String(phone)
          .replace(
            /\D/g,
            ''
          );


      const cuts =
        Number(
          client.cortes_completados ||
          0
        );


      const benefit =
        client.beneficio_disponible ===
        true;


      /*
        IMPORTANTE:

        El cliente llega con 5/5 cuando
        completó sus 5 cortes pagados.

        En ese momento aparece el beneficio
        gratis.

        Al utilizarlo vuelve a 0/5.
      */


      card.innerHTML = `

        <div class="reservation-top">


          <div>

            <div class="reservation-time">

              ⏰ ${formatTime(
                reservation.hora
              )}

            </div>


            <div class="reservation-date">

              📅 ${formatDate(
                reservation.fecha
              )}

            </div>

          </div>


          <span
            class="status ${statusClass}">

            ${statusText}

          </span>


        </div>


        <div class="reservation-info">


          <div class="info-line">

            👤 <span>Cliente:</span>

            ${escapeHTML(
              clientName
            )}

          </div>


          <div class="info-line">

            📱 <span>WhatsApp:</span>

            ${escapeHTML(
              phone
            )}

          </div>


          <div class="info-line">

            ✂️ <span>Servicio:</span>

            ${escapeHTML(
              serviceName
            )}

            ${
              formattedPrice
                ? ' · ' +
                  formattedPrice
                : ''
            }

          </div>


          <div class="info-line">

            📌 <span>Estado:</span>

            ${escapeHTML(
              statusText
            )}

          </div>


        </div>


        <!-- FIDELIDAD -->

        <div class="loyalty">


          <div class="loyalty-title">


            <strong>
              🎟️ Fidelidad
            </strong>


            <strong>
              ${Math.min(cuts,5)} / 5
            </strong>


          </div>


          <div class="stamps">

            ${createStamps(
              cuts
            )}

          </div>


          ${
            benefit

              ? `

                <div class="free-message">

                  🎁 ¡CORTE GRATIS DISPONIBLE!

                </div>


                <button
                  class="loyalty-btn free"
                  onclick="useBenefit('${escapeAttribute(client.id || '')}')">

                  🎁 USAR BENEFICIO GRATIS

                </button>

              `

              : `

                <div class="loyalty-message">

                  ${
                    cuts === 0

                      ? 'Cliente comenzando su tarjeta.'

                      : cuts >= 4

                        ? '🎯 ¡Este es su último corte pagado antes del beneficio!'

                        : `Le faltan ${5 - cuts} corte(s) para completar la tarjeta.`

                  }

                </div>


                ${
                  estado === 'confirmada'

                    ? `

                      <button
                        class="loyalty-btn"
                        onclick="addCut('${escapeAttribute(client.id || '')}')">

                        ➕ SUMAR CORTE

                      </button>

                    `

                    : `

                      <div
                        class="loyalty-message"
                        style="margin-top:10px;">

                        🔒 Confirma la reserva para poder registrar el corte.

                      </div>

                    `

                }

              `
          }


        </div>


        <!-- ACCIONES -->


        <div class="actions">


          ${
            estado !==
            'confirmada'

              ? `

                <button
                  class="action-btn confirm-btn"
                  onclick="changeStatus(
                    '${escapeAttribute(reservation.id)}',
                    'confirmada'
                  )">

                  🟢 CONFIRMAR

                </button>

              `

              : ''

          }


          ${
            estado !==
            'cancelada'

              ? `

                <button
                  class="action-btn cancel-btn"
                  onclick="changeStatus(
                    '${escapeAttribute(reservation.id)}',
                    'cancelada'
                  )">

                  🔴 CANCELAR

                </button>

              `

              : ''

          }


          ${
            whatsappNumber

              ? `

                <button
                  class="action-btn whatsapp-btn"
                  onclick="openWhatsApp(
                    '${escapeAttribute(whatsappNumber)}',
                    '${escapeAttribute(clientName)}',
                    '${escapeAttribute(reservation.fecha)}',
                    '${escapeAttribute(formatTime(reservation.hora))}',
                    '${escapeAttribute(serviceName)}',
                    '${escapeAttribute(price || '')}',
                    '${escapeAttribute(estado)}'
                  )">

                  📲 WHATSAPP

                </button>

              `

              : ''

          }


        </div>


      `;


      reservationsList.appendChild(
        card
      );

    }
  );

}


/* ==========================================
   CREAR SELLOS
   ========================================== */

function createStamps(
  cuts
){

  let html =
    '';


  const safeCuts =
    Math.min(
      Number(cuts) || 0,
      5
    );


  for(
    let i = 1;
    i <= 5;
    i++
  ){

    if(
      i <= safeCuts
    ){

      html +=
        `<div class="stamp active">✂</div>`;

    }else if(
      i === 5
    ){

      html +=
        `<div class="stamp">🎁</div>`;

    }else{

      html +=
        `<div class="stamp">✂</div>`;

    }

  }


  return html;

}


/* ==========================================
   SUMAR CORTE
   ========================================== */

async function addCut(
  clientId
){

  if(!clientId){

    alert(
      'No se encontró el cliente.'
    );

    return;

  }


  const {
    data:client,
    error:clientError
  } =
    await supabaseClient
      .from('clientes')
      .select(
        'cortes_completados,beneficio_disponible'
      )
      .eq(
        'id',
        clientId
      )
      .single();


  if(clientError){

    alert(
      'No se pudo obtener la información del cliente.\n\n' +
      clientError.message
    );

    return;

  }


  let cuts =
    Number(
      client.cortes_completados ||
      0
    );


  if(
    client.beneficio_disponible
  ){

    alert(
      '🎁 Este cliente ya tiene un corte gratis disponible.'
    );

    return;

  }


  if(
    cuts >= 5
  ){

    alert(
      'El cliente ya completó 5 cortes.'
    );

    return;

  }


  const confirmCut =
    confirm(
      `¿Registrar este corte como pagado?\n\n` +
      `Progreso actual: ${cuts}/5\n` +
      `Después quedará en: ${cuts + 1}/5`
    );


  if(!confirmCut){

    return;

  }


  cuts++;


  let benefit =
    false;


  if(
    cuts === 5
  ){

    benefit =
      true;

  }


  const {
    error
  } =
    await supabaseClient
      .from('clientes')
      .update({

        cortes_completados:
          cuts,

        beneficio_disponible:
          benefit

      })
      .eq(
        'id',
        clientId
      );


  if(error){

    alert(
      'No se pudo sumar el corte.\n\n' +
      error.message
    );

    return;

  }


  if(
    benefit
  ){

    alert(
      '🎉 ¡TARJETA COMPLETADA!\n\n' +
      'El cliente llegó a 5/5.\n\n' +
      '🎁 Tiene un corte GRATIS disponible.'
    );

  }else{

    alert(
      `✅ Corte registrado.\n\n` +
      `Progreso: ${cuts}/5`
    );

  }


  loadReservations();

}


/* ==========================================
   USAR BENEFICIO
   ========================================== */

async function useBenefit(
  clientId
){

  if(!clientId){

    alert(
      'No se encontró el cliente.'
    );

    return;

  }


  const confirmUse =
    confirm(
      '🎁 ¿Confirmas que el cliente está utilizando su corte GRATIS?\n\n' +
      'Después de utilizarlo, su tarjeta volverá a 0/5.'
    );


  if(!confirmUse){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from('clientes')
      .update({

        cortes_completados:
          0,

        beneficio_disponible:
          false

      })
      .eq(
        'id',
        clientId
      );


  if(error){

    alert(
      'No se pudo utilizar el beneficio.\n\n' +
      error.message
    );

    return;

  }


  alert(
    '🎁 Beneficio utilizado correctamente.\n\n' +
    'La tarjeta comenzó nuevamente en 0/5.'
  );


  loadReservations();

}


/* ==========================================
   CAMBIAR ESTADO
   ========================================== */

async function changeStatus(
  reservationId,
  newStatus
){

  const text =
    newStatus ===
    'confirmada'

      ? '¿Confirmar esta reserva?'

      : '¿Cancelar esta reserva?';


  if(
    !confirm(text)
  ){

    return;

  }


  const {
    error
  } =
    await supabaseClient
      .from('reservas')
      .update({

        estado:
          newStatus

      })
      .eq(
        'id',
        reservationId
      );


  if(error){

    alert(
      'No se pudo actualizar la reserva.\n\n' +
      error.message
    );

    return;

  }


  alert(

    newStatus ===
    'confirmada'

      ? '✅ Reserva confirmada correctamente.'

      : '🔴 Reserva cancelada correctamente.'

  );


  /*
    IMPORTANTE:

    Confirmar o cancelar NO abre WhatsApp.

    Si quieres enviar el mensaje,
    debes presionar el botón
    📲 WHATSAPP.
  */


  loadReservations();

}


/* ==========================================
   WHATSAPP MEJORADO
   ========================================== */

function openWhatsApp(
  phone,
  name,
  reservationDate,
  reservationTime,
  serviceName,
  price,
  status
){

  let message =
    '';


  const formattedDate =
    formatDate(
      reservationDate
    );


  const formattedPrice =
    price

      ? '$' +
        Number(price)
          .toLocaleString(
            'es-CL'
          )

      : '';


  /* ======================================
     RESERVA CONFIRMADA
     ====================================== */

  if(
    status ===
    'confirmada'
  ){

    message =
      `👑 Hola ${name}, te hablamos de Rey de Reyes Barbería.\n\n` +

      `🟢 *TU RESERVA HA SIDO CONFIRMADA*\n\n` +

      `✂️ Servicio: ${serviceName}\n` +

      `💰 Precio: ${formattedPrice}\n` +

      `📅 Fecha: ${formattedDate}\n` +

      `⏰ Hora: ${reservationTime}\n\n` +

      `📍 María Cristina 6600, La Florida, Santiago\n\n` +

      `¡Te esperamos! 👑✂️\n\n` +

      `Rey de Reyes · Barbería`;

  }


  /* ======================================
     RESERVA CANCELADA
     ====================================== */

  else if(
    status ===
    'cancelada'
  ){

    message =
      `👑 Hola ${name}, te hablamos de Rey de Reyes Barbería.\n\n` +

      `🔴 *TU RESERVA HA SIDO CANCELADA*\n\n` +

      `✂️ Servicio: ${serviceName}\n` +

      `📅 Fecha: ${formattedDate}\n` +

      `⏰ Hora: ${reservationTime}\n\n` +

      `Si quieres reservar nuevamente, escríbenos y con gusto te ayudaremos a encontrar otra hora. 👑✂️\n\n` +

      `Rey de Reyes · Barbería`;

  }


  /* ======================================
     RESERVA PENDIENTE
     ====================================== */

  else{

    message =
      `👑 Hola ${name}, te hablamos de Rey de Reyes Barbería.\n\n` +

      `📋 *INFORMACIÓN DE TU RESERVA*\n\n` +

      `✂️ Servicio: ${serviceName}\n` +

      `💰 Precio: ${formattedPrice}\n` +

      `📅 Fecha: ${formattedDate}\n` +

      `⏰ Hora: ${reservationTime}\n\n` +

      `Tu reserva está pendiente de confirmación.\n\n` +

      `¡Gracias por preferir Rey de Reyes! 👑✂️`;

  }


  const url =
    `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;


  window.open(
    url,
    '_blank'
  );

}


/* ==========================================
   FORMATO FECHA
   ========================================== */

function formatDate(
  date
){

  if(!date){

    return '';

  }


  const selected =
    new Date(
      date +
      'T12:00:00'
    );


  return selected.toLocaleDateString(
    'es-CL',
    {
      weekday:'long',
      day:'numeric',
      month:'long',
      year:'numeric'
    }
  );

}


/* ==========================================
   FORMATO HORA
   ========================================== */

function formatTime(
  time
){

  if(!time){

    return '';

  }


  return String(
    time
  ).substring(
    0,
    5
  );

}


/* ==========================================
   SEGURIDAD HTML
   ========================================== */

function escapeHTML(
  text
){

  return String(
    text ?? ''
  )

  .replace(
    /&/g,
    '&amp;'
  )

  .replace(
    /</g,
    '&lt;'
  )

  .replace(
    />/g,
    '&gt;'
  )

  .replace(
    /"/g,
    '&quot;'
  )

  .replace(
    /'/g,
    '&#039;'
  );

}


function escapeAttribute(
  text
){

  return String(
    text ?? ''
  )

  .replace(
    /\\/g,
    '\\\\'
  )

  .replace(
    /'/g,
    "\\'"
  )

  .replace(
    /\n/g,
    '\\n'
  )

  .replace(
    /\r/g,
    '\\r'
  );

}
